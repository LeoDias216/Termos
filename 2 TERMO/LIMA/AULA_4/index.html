<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- icone favorito -->
    <link rel="shortcut icon" href="Imagens/favicon.ico" type="image/x-icon">

    <title>FAVICONS e IMAGENS</title>
</head>
<body>
    <h1>Imagens do Google</h1>
    <h2>THANINHOS!</h2>
    <div>
        <!-- Tag para acrescentar imagens - img -->
        <img src="Imagens/Imagem_thaninhos.jpeg" alt="Thanos com as mini joias do infinito" title="Thanos" align="right">
    </div>
    

    <h2>Thaninhos - com proporção de imagens</h2>

    <div>
        <img src="Imagens/Imagem_thaninhos.png" 
        alt="Thanos com as mini joias do infinito"
        title="Thanos"
        width="800px"
        height="600px"
        border-radius: 10px
        >
    </div>

    <h2>Thaninhos - com proporção de imagens com style</h2>
    <div>
        <img src="Imagens/Imagem_thaninhos.png" 
        alt="Thanos com as mini joias do infinito"
        title="Thanos"
        style="margin: 20px;
        background-image: url(Imagens/Imagem_thaninhos.png);
        background-size: auto;
        background-repeat: repeat-y;
        width: 100px;
        height: 200px;
        "
        
        >
    </div>
    
</body>
</html>
