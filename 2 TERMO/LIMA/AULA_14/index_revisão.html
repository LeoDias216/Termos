<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Revisão HTML - Conceitos Flex e Grid</title>
</head>
<body>
    <section class="titulo-secao">
        <header class="titulo">
            <a href="#logo"><h1><span>RETRO</span>GAME</h1></a>

            <h3>Com grandes poderes vem grandes responsabilidades</h3>

            <nav>
                <ul class="nav">
                    <a href="#inicio">Início</a>
                    <a href="#sobre">Sobre</a>
                </ul>
            </nav>
        </header>
    </section>

    <main>
        <section class="conteudo">
            <article class="conteudo-art">
                <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Animi, nulla. Quos, voluptas rem illo voluptatum incidunt dolorum explicabo quia consequatur iure ut adipisci corporis aut unde. Optio est dolor atque!</p>
            </article>

            <figure class="conteudo-img">
                <img src="https://upload.wikimedia.org/wikipedia/pt/2/21/The_Legend_of_Zelda_Majora%27s_Mask_3D_p%C3%B4ster_promocional.png?utm_source=pt.wikipedia.org&utm_campaign=index&utm_content=original" alt="Imagem 1 - Ilustrativa">
                <figcaption>
                    The Legend of Zelda: Majora's Mask 3D
                </figcaption>
            </figure>
        </section>

        <section class="galeria">
            <ul class="galeria-img">
                <figure>
                    <h1>The Legend of Zelda:Ocarina of Time</h1>
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTYWA72vUENIodHNNXnosIyTtexvzDLRZ5FpZivjr6qYQ&s" alt="Imagem gerada por IA">
                </figure>
                <figure>
                    <h1>The Legend of Zelda:Tears of the Kingdom</h1>
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSElSBsBuI0Xf4QlQt8M7lTCpUR2Nnf6Gpz2URfrO0oK4VoIEOUvuTCgXPx&s=10" alt="Imagem gerada por IA">
                </figure>
                <figure>
                    <h1>The Legend of Zelda:Twilight Princess</h1>
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTUJB5_sW0tFwoD7_cS-F8zo5dbdS4htMb85hsebLoWlMm7Uoan20QjLy1m&s=10" alt="Imagem gerada por IA">
                </figure>
                
            </ul>
        </section>

        <section class="imagem">
            <figure class="imagem-img">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRf_Aquf2E4jSVa9tm4EmBlBRwpG4h-oJqlOo_K5qPqjA&s" alt="Imagem ilustrativa 5">
            </figure>
        </section>

        <section class="cartoes">
            <figure class="cartoes-img">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSEtaijkTna7LNowM42VYDck3x8OzeWg3pzLKo2zR74qM2jgEQQgDCOqA8&s=10" alt="Imagem ilustrativa 6">
                <aside class="cartoes-corpo">
                    <h3>The Legend of Zelda:The Wind Waker</h3>
                    <p>Uma aventura em Hyrule aguarda</p>
                </aside>
            </figure>
        </section>

        <section class="final">
            <figure class="imagem-final">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTEkPNoKB6pvF1fT6M2dYxcDfBWVi_GsFwoBZKEQMd2LhbuuYWGUaptvyQ&s=10" alt="Imagem ilustrativa final">
                <figcaption>
                    <strong>Imagem em destaque</strong>
                    <small>Foto por Leonardo Dias</small>
                </figcaption>
            </figure>
        </section>

    </main>

</body>
</html>
